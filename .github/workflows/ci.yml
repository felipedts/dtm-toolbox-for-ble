name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build DtmToolbox.sln -c Release

      - name: Test
        run: dotnet test DtmToolbox.sln -c Release --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: DtmToolbox
          path: src/DtmToolbox/bin/Release/net462/DtmToolbox.exe
